version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dental_tracker_db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperStrong!Passw0rd2024
      - MSSQL_PID=Developer
    volumes:
      - sqlvolume:/var/opt/mssql

volumes:
  sqlvolume:
